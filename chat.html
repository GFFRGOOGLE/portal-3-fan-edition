<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal 3 — Чат</title>
    <link rel="icon" href="portal3-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ====== ТОЧНО КАК В ОСТАЛЬНЫХ СТРАНИЦАХ ====== */
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Карточка — как .download-card, .server-info и т.д. */
        .chat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .chat-card h2 {
            color: #58a6ff;
            margin-bottom: 16px;
            font-size: 1.3rem;
        }

        .chat-card p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        /* Панель пользователя */
        .user-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .user-bar.active { display: flex; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #238636;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .admin-badge {
            background: #f0883e;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            margin-left: 6px;
        }
        .logout-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #f85149;
            background: transparent;
            color: #f85149;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #f8514922; }

        /* Гостевая панель */
        .guest-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin-bottom: 16px;
            color: #8b949e;
        }
        .guest-bar.active { display: flex; }

        /* Кнопка — как .download-btn */
        .btn-primary {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #238636;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover { background: #2ea043; }

        .btn-secondary {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e0e6f0;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn-secondary:hover { background: #30363d; }

        /* Админ панель */
        .admin-panel {
            display: none;
            padding: 16px;
            background: #1a1f2e;
            border: 1px solid #f0883e;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .admin-panel.active { display: block; }
        .admin-panel h3 { color: #f0883e; margin-bottom: 12px; }
        .admin-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #e0e6f0;
        }
        .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Сообщения */
        .messages-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-own {
            align-self: flex-end;
            background: #238636;
            color: #fff;
            border-radius: 12px 12px 2px 12px;
        }
        .msg-other {
            align-self: flex-start;
            background: #21262d;
            color: #e0e6f0;
            border-radius: 12px 12px 12px 2px;
        }
        .msg-admin {
            align-self: flex-start;
            background: #f0883e22;
            border: 1px solid #f0883e;
            color: #f0883e;
            border-radius: 12px 12px 12px 2px;
        }
        .msg-name {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 2px;
            opacity: 0.9;
        }
        .msg-time {
            font-size: 0.65rem;
            opacity: 0.6;
            margin-top: 2px;
            text-align: right;
        }

        /* Ввод */
        .input-row {
            display: none;
            gap: 8px;
        }
        .input-row.active { display: flex; }
        .input-row input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e0e6f0;
            font-size: 0.9rem;
            outline: none;
        }
        .input-row input:focus { border-color: #58a6ff; }
        .input-row button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #238636;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .input-row button:hover { background: #2ea043; }

        .guest-hint {
            text-align: center;
            color: #8b949e;
            padding: 12px;
            font-size: 0.9rem;
        }

        /* Модалка авторизации */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-modal.active { display: flex; }
        .auth-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 380px;
        }
        .auth-box h2 {
            color: #58a6ff;
            margin-bottom: 8px;
            text-align: center;
        }
        .auth-box > p {
            text-align: center;
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e0e6f0;
            margin-bottom: 10px;
            font-size: 0.95rem;
            outline: none;
        }
        .auth-form input:focus { border-color: #58a6ff; }
        .auth-divider {
            text-align: center;
            color: #8b949e;
            margin: 14px 0;
            font-size: 0.85rem;
        }
        .auth-switch {
            text-align: center;
            margin-top: 14px;
            color: #8b949e;
            font-size: 0.9rem;
        }
        .auth-switch a {
            color: #58a6ff;
            cursor: pointer;
        }
        .auth-switch a:hover { text-decoration: underline; }
        .auth-error {
            color: #f85149;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }
        .auth-error.active { display: block; }
    </style>
    <script>
(function() {
    // Проверяем, что это не play.html, index.html и не сама реклама
    const currentPage = window.location.pathname.split('/').pop();
    if (currentPage === 'play.html' || currentPage === 'index.html' || currentPage === 'ad-tmvpn.html') return;
    
    // Открываем рекламу при любом клике по ссылке
    document.addEventListener('click', function(e) {
        const target = e.target.closest('a');
        if (!target) return;
        
        const href = target.getAttribute('href');
        if (!href) return;
        
        // Не перехватываем play.html, index.html и внешние ссылки
        if (href.includes('play.html') || href.includes('index.html') || href.startsWith('http')) return;
        
        e.preventDefault();
        window.open('ad-tmvpn.html', '_blank');
        // Также открываем исходную ссылку
        window.location.href = href;
    });
})();
</script>

</head>
<body>
    <div class="container">
        <h1>🚀 Portal 3: Fan Edition</h1>
        <p class="subtitle">Чат сообщества</p>

        <div class="nav">
            <a href="index.html">Главная</a>
            <a href="download.html">Скачать</a>
            <a href="minecraft.html">Майнкрафт</a>
            <a href="cheats.html">Читы</a>
            <a href="support.html">Поддержка</a>
            <a href="chat.html" class="active">Чат</a>
        </div>

        <!-- Панель пользователя -->
        <div class="user-bar" id="userBar">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div>
                    <span id="userName">...</span>
                    <span id="adminBadge"></span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <!-- Гостевая панель -->
        <div class="guest-bar active" id="guestBar">
            <span>🔒 Войдите, чтобы участвовать в чате</span>
            <button class="btn-primary" onclick="openAuth()">Войти</button>
        </div>

        <!-- Админ панель -->
        <div class="admin-panel" id="adminPanel">
            <h3>⚡️ Админ-панель</h3>
            <div class="admin-stats">
                <div>Сообщений: <span id="msgCount">0</span></div>
                <div>Пользователей: <span id="userCount">0</span></div>
            </div>
            <div class="admin-actions">
                <button class="btn-secondary" onclick="clearAllMessages()">🗑 Очистить чат</button>
                <button class="btn-secondary" onclick="banUserPrompt()">🔨 Забанить</button>
            </div>
        </div>

        <!-- Чат -->
        <div class="chat-card">
            <h2>💬 Portal Chat</h2>
            <div class="messages-box" id="messagesBox">
                <div style="text-align:center;color:#8b949e;padding:20px;">Загрузка сообщений...</div>
            </div>
            <div class="input-row" id="inputRow">
                <input type="text" id="msgInput" placeholder="Введите сообщение..." maxlength="300" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Отправить</button>
            </div>
            <div class="guest-hint" id="guestHint">
                <a href="#" onclick="openAuth(); return false;" style="color:#58a6ff;">Войдите</a>, чтобы писать в чат
            </div>
        </div>
    </div>

    <div class="footer">© 2026 — GFFRGOOGLE | Portal 3: Fan Edition</div>

    <!-- Модалка -->
    <div class="auth-modal" id="authModal">
        <div class="auth-box" id="authBox"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const API_URL = 'http://localhost:9000/api';
        const WS_URL = 'http://localhost:9000';

        let socket = null;
        let currentUser = null;
        let isAdmin = false;
        let token = localStorage.getItem('portal3_token');

        const userBar = document.getElementById('userBar');
        const guestBar = document.getElementById('guestBar');
        const guestHint = document.getElementById('guestHint');
        const inputRow = document.getElementById('inputRow');
        const adminPanel = document.getElementById('adminPanel');
        const messagesBox = document.getElementById('messagesBox');
        const authModal = document.getElementById('authModal');
        const authBox = document.getElementById('authBox');

        async function init() {
            if (token) {
                try {
                    const res = await fetch(API_URL + '/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        currentUser = await res.json();
                        isAdmin = currentUser.isAdmin;
                        showUserUI();
                    } else {
                        localStorage.removeItem('portal3_token');
                        token = null;
                        showGuestUI();
                    }
                } catch (e) {
                    showGuestUI();
                }
            } else {
                showGuestUI();
            }
            connectSocket();
            loadMessages();
        }

        function connectSocket() {
            socket = io(WS_URL, { auth: { token } });

            socket.on('messages', (msgs) => {
                renderMessages(msgs);
            });

            socket.on('new_message', (msg) => {
                appendMessage(msg);
            });

            socket.on('messages_cleared', () => {
                messagesBox.innerHTML = '<div style="text-align:center;color:#8b949e;padding:20px;">Чат очищен</div>';
            });

            socket.on('error', (err) => {
                alert(err.message);
            });
        }

        async function loadMessages() {
            try {
                const res = await fetch(API_URL + '/chat/messages?limit=50');
                const msgs = await res.json();
                renderMessages(msgs);
            } catch (e) {
                messagesBox.innerHTML = '<div style="text-align:center;color:#f85149;padding:20px;">Ошибка загрузки сообщений</div>';
            }
        }

        function renderMessages(msgs) {
            messagesBox.innerHTML = '';
            if (!msgs || msgs.length === 0) {
                messagesBox.innerHTML = '<div style="text-align:center;color:#8b949e;padding:20px;">Пока нет сообщений. Будьте первым!</div>';
                return;
            }
            msgs.forEach(m => appendMessage(m, false));
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function appendMessage(msg, scroll = true) {
            const div = document.createElement('div');
            let msgClass = 'msg-other';
            if (msg.isAdmin) msgClass = 'msg-admin';
            else if (currentUser && msg.userId === currentUser.id) msgClass = 'msg-own';

            div.className = 'msg ' + msgClass;
            div.innerHTML = `
                <div class="msg-name">${esc(msg.username)} ${msg.isAdmin ? '<span class="admin-badge">АДМИН</span>' : ''}</div>
                <div>${esc(msg.text)}</div>
                <div class="msg-time">${fmtTime(msg.timestamp)}</div>
            `;
            messagesBox.appendChild(div);
            if (scroll) messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function esc(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function fmtTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function showUserUI() {
            userBar.classList.add('active');
            guestBar.classList.remove('active');
            guestHint.style.display = 'none';
            inputRow.classList.add('active');
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username[0].toUpperCase();
            if (isAdmin) {
                document.getElementById('adminBadge').innerHTML = ' <span class="admin-badge">АДМИН</span>';
                adminPanel.classList.add('active');
                updateAdminStats();
            }
        }

        function showGuestUI() {
            userBar.classList.remove('active');
            guestBar.classList.add('active');
            guestHint.style.display = 'block';
            inputRow.classList.remove('active');
            adminPanel.classList.remove('active');
        }

        function logout() {
            localStorage.removeItem('portal3_token');
            token = null;
            currentUser = null;
            isAdmin = false;
            if (socket) socket.disconnect();
            showGuestUI();
            connectSocket();
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            if (!token) { openAuth(); return; }
            input.value = '';

            try {
                await fetch(API_URL + '/chat/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ text })
                });
            } catch (e) {
                socket.emit('send_message', { text });
            }
        }

        async function clearAllMessages() {
            if (!confirm('Очистить весь чат?')) return;
            try {
                await fetch(API_URL + '/chat/messages', {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch (e) { alert('Ошибка'); }
        }

        function banUserPrompt() {
            const uid = prompt('Введите ID пользователя:');
            if (uid) {
                fetch(API_URL + '/chat/ban', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ userId: uid })
                });
            }
        }

        function updateAdminStats() {
            document.getElementById('msgCount').textContent = document.querySelectorAll('.msg').length;
            document.getElementById('userCount').textContent = '—';
        }

        // ====== АВТОРИЗАЦИЯ ======
        function openAuth() {
            authModal.classList.add('active');
            showLoginForm();
        }

        function closeAuth() {
            authModal.classList.remove('active');
        }

        function showLoginForm() {
            authBox.innerHTML = `
                <h2>🔐 Войти</h2>
                <p>Войдите, чтобы общаться в чате</p>
                <div class="auth-form">
                    <input type="email" id="loginEmail" placeholder="Email">
                    <input type="password" id="loginPassword" placeholder="Пароль">
                    <div class="auth-error" id="loginError"></div>
                    <button class="btn-primary" style="width:100%;" onclick="loginEmail()">Войти</button>
                </div>
                <div class="auth-divider">— или —</div>
                <button class="btn-primary" style="width:100%;" onclick="showRegisterForm()">Создать аккаунт</button>
            `;
        }

        function showRegisterForm() {
            authBox.innerHTML = `
                <h2>📝 Регистрация</h2>
                <p>Создайте аккаунт для участия в чате</p>
                <div class="auth-form">
                    <input type="text" id="regName" placeholder="Имя пользователя">
                    <input type="email" id="regEmail" placeholder="Email">
                    <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)">
                    <input type="password" id="regPassword2" placeholder="Повторите пароль">
                    <div class="auth-error" id="regError"></div>
                    <button class="btn-primary" style="width:100%;" onclick="registerEmail()">Зарегистрироваться</button>
                </div>
                <div class="auth-switch">Уже есть аккаунт? <a onclick="showLoginForm()">Войти</a></div>
            `;
        }

        async function loginEmail() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            try {
                const res = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                token = data.token;
                currentUser = data.user;
                isAdmin = data.user.isAdmin;
                localStorage.setItem('portal3_token', token);
                closeAuth();
                showUserUI();
                if (socket) socket.disconnect();
                connectSocket();
            } catch (e) {
                errEl.textContent = e.message;
                errEl.classList.add('active');
            }
        }

        async function registerEmail() {
            const username = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            const errEl = document.getElementById('regError');
            if (password !== password2) {
                errEl.textContent = 'Пароли не совпадают';
                errEl.classList.add('active');
                return;
            }
            try {
                const res = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                token = data.token;
                currentUser = data.user;
                isAdmin = data.user.isAdmin;
                localStorage.setItem('portal3_token', token);
                closeAuth();
                showUserUI();
                if (socket) socket.disconnect();
                connectSocket();
            } catch (e) {
                errEl.textContent = e.message;
                errEl.classList.add('active');
            }
        }

        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) closeAuth();
        });

        init();
    </script>
</body>
</html>
